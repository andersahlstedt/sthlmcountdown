<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drinklista</title>
    <style>
        body {
            font-family: "Georgia", serif;
            background: #f5f2eb;
            color: #2c2c2c;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: #e5ded1;
            border-bottom: 1px solid #d2c7b8;
        }

        h1 {
            margin: 0;
            font-size: 2.6rem;
            letter-spacing: 0.05em;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h2 {
            margin-top: 50px;
            font-size: 1.6rem;
            border-bottom: 2px solid #b69c7d;
            padding-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .drink {
            font-size: 1.2rem;
            padding: 10px 0;
            border-bottom: 1px dotted #b9a894;
        }
    </style>
</head>
<body>

<header>
    <h1>Drinklista</h1>
</header>

<div class="container">
    <h2>Alkoholfritt</h2>
    <div class="drink">Hugo Spritz NA</div>
    <div class="drink">Brooklyn Special Effects IPA</div>

    <h2>Alkohol</h2>
    <div class="drink">Hugo Spritz</div>
    <div class="drink">Dark'n'Stormy</div>
    <div class="drink">Rött vin (Sangiovese)</div>
</div>

</body>
</html>
